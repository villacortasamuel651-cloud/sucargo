server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy al backend: /api/xxx -> http://backend:8080/api/xxx (no quita el prefijo).
    # Si tus endpoints NO empiezan con /api, cambia a:  proxy_pass http://backend:8080/;
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger a través del mismo puerto (opcional)
    location /swagger-ui/ {
        proxy_pass http://backend:8080;
    }
    location /v3/api-docs {
        proxy_pass http://backend:8080;
    }

    # React Router: cualquier ruta cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
